[build]
  command   = "npm run build"
  publish   = "dist/public"
  functions = "netlify/functions"

[dev]
  framework  = "#static"
  publish    = "dist/public"
  functions  = "netlify/functions"
  port       = 8888

# Send all /api/* requests to the serverless function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# SPA fallback — only when the file doesn't exist
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
